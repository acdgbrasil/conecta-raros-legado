services:
  # --- Reverse Proxy (Nginx) ---
  nginx:
    image: nginx:alpine
    container_name: conecta-proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - conecta-network

  # --- Backend (Node.js/Bun) ---
  backend:
    build:
      context: ./conecta-social
      dockerfile: Dockerfile
    container_name: conecta-backend
    restart: always
    expose:
      - "3000"
    # Hot Reload: Mapeia pasta local para container
    volumes:
      - ./conecta-social:/app
      - /app/node_modules
    # Bun nativo com watch mode
    command: bun run dev
    env_file:
      - ./conecta-social/.env
    environment:
      - POSTGRES_HOST=postgres
      - MONGO_LOCAL_URL=mongodb://mongo:27017/conecta_social
      - PORT=3000
    depends_on:
      - postgres
      - mongo
    networks:
      - conecta-network

  # --- Frontend (Next.js/Bun) ---
  frontend:
    build:
      context: ./conecta-social-front
      dockerfile: Dockerfile
    container_name: conecta-frontend
    restart: always
    expose:
      - "3000"
    # Hot Reload: Mapeia pasta local e roda servidor de dev
    volumes:
      - ./conecta-social-front:/app
      - /app/node_modules
      - /app/.next
    command: bun run dev
    environment:
      # Configuração para o apiClient.ts
      # NEXT_PUBLIC_API_URL: Usada pelo navegador (Client-Side) através do Nginx (localhost:80)
      - NEXT_PUBLIC_API_URL=http://localhost:80
      # INTERNAL_API_URL: Usada pelo servidor (SSR) para comunicação interna na rede Docker
      - INTERNAL_API_URL=http://backend:3000
      # Otimização para watcher em containers
      - WATCHPACK_POLLING=true
    depends_on:
      - backend
    networks:
      - conecta-network

  # --- Bancos de Dados ---
  postgres:
    image: postgres:15-alpine
    container_name: conecta-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-conecta_social}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - conecta-network

  mongo:
    image: mongo:6.0
    container_name: conecta-mongo
    restart: always
    command: ["mongod", "--quiet", "--bind_ip_all"]
    expose:
      - "27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - conecta-network

networks:
  conecta-network:
    driver: bridge

volumes:
  postgres_data:
  mongo_data: