services:
  # --- Reverse Proxy (Nginx) ---
  nginx:
    image: nginx:alpine
    container_name: conecta-proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - conecta-network

  # --- Backend (Node.js) ---
  backend:
    build:
      context: ./conecta-social
      dockerfile: Dockerfile
    container_name: conecta-backend
    restart: always
    expose:
      - "3000"
    env_file:
      - ./conecta-social/.env
    environment:
      - POSTGRES_HOST=postgres
      - MONGO_LOCAL_URL=mongodb://mongo:27017/conecta_social
      - PORT=3000
    depends_on:
      - postgres
      - mongo
    networks:
      - conecta-network

  # --- Frontend (Bun) ---
  frontend:
    build:
      context: ./conecta-social-front
      dockerfile: Dockerfile
    container_name: conecta-frontend
    restart: always
    expose:
      - "3000"
    environment:
      # Agora a API é acessível na mesma origem (localhost:80)
      - VITE_API_URL=
    depends_on:
      - backend
    networks:
      - conecta-network

  # --- Bancos de Dados ---
  postgres:
    image: postgres:15-alpine
    container_name: conecta-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-conecta_social}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - conecta-network

  mongo:
    image: mongo:6.0
    container_name: conecta-mongo
    restart: always
    expose:
      - "27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - conecta-network

networks:
  conecta-network:
    driver: bridge

volumes:
  postgres_data:
  mongo_data: