events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # DNS do Docker para resolver nomes dinamicamente
    resolver 127.0.0.11 valid=30s;

    server {
        listen 80;
        server_name localhost;

        # Variáveis para evitar erro de inicialização se o container estiver offline
        set $backend_upstream http://backend:3000;
        set $frontend_upstream http://frontend:3000;

        # Health check do Gateway Backend
        location /health {
            proxy_pass $backend_upstream/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Rotas Unificadas da API (IAM e Notifications)
        location /api {
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Frontend (Opcional - só funcionará se o container subir)
        location / {
            proxy_pass $frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
