# Cenario 2: Backend rodando Local (Host)
# Use: docker compose -f ops/docker/compose.backend-local.yml up -d
# O Backend deve ser iniciado localmente com: bun run dev

include:
  - compose.infra.yml

services:
  # Reconfigura o Nginx para apontar para o host.docker.internal
  nginx:
    volumes:
      - ./nginx/nginx.host.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway" # Permite acesso ao host no Linux
