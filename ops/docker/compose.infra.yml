services:
  # --- Reverse Proxy (Nginx) ---
  nginx:
    image: nginx:alpine
    container_name: conecta-proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      # Caminho relativo ao arquivo compose.infra.yml
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - conecta-network
    logging: &default-logging
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # --- Bancos de Dados ---
  postgres:
    image: postgres:18-alpine
    container_name: conecta-postgres
    restart: always
    command: postgres -c log_min_messages=WARNING
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-conecta_social}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - conecta-network
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  mongo:
    image: mongo:8.0
    container_name: conecta-mongo
    restart: always
    command: ["mongod", "--quiet", "--bind_ip_all"]
    expose:
      - "27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - conecta-network
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "echo 'db.runCommand(\"ping\").ok' | mongosh localhost:27017/test --quiet"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  conecta-network:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:
