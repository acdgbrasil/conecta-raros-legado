# bunfig.toml - Optimized for Conecta Social (Bun Native)
# Documentation: https://bun.sh/docs/runtime/bunfig

telemetry = false

[install]
# Crucial para o design modular (src/modules/*)
linkWorkspacePackages = true
# Instala peer dependencies automaticamente
peer = true

[install.lockfile]
# Padrão moderno Bun 1.2+ (Garante diffs limpos no Git)
print = "bun"

[run]
# Força o runner nativo do Bun em todos os scripts do package.json
bun = true

[test]
# Garante que os testes procurem em toda a árvore do projeto
root = "."
coverage = false